name: tests

# The suite is the thing that decides whether the accuracy work converges, so
# it runs on every push.  The ROM-dependent modules skip themselves: no ROM
# belongs in this repository, and the rest of the suite builds its own test
# images from source in tests/.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip cython setuptools
      - name: Build the cores
        run: python build.py
      - name: Run the suite
        run: python tools/runtests.py
